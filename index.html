<!DOCTYPE html>
<html lang="en">
<head>
    <title>Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>

<body>
    <div class="title">
        <h1>Australian Protected Areas</h1>
    </div>
    <div class="hero">
    <img src="forest.jpg" class="image">   
    </div>
    <section class="section">
    <div id="chart1" class="section"></div>
    <script>
        vegaEmbed('#chart1', 'idiom1.json',{actions: false})
    </script>
    </section>

    <section class="section1">
        <div class="section1">
            <h2>Protected Areas By State</h2>    
        </div>
        <div class="section1_charts">
        <div class="section1_chart">
            <h3>Number of Protected Areas by Jurisdiction</h3>
            <div id="chart2" class="section1_chart"></div>
        </div>
        <div class="section1_chart">
            <h3>Total Protected Area by State</h3>
            <div id="chart3" class="section1_chart"></div>
        </div>
        <div class="section1_chart">
            <h3>Protected Area vs Total Area by State</h3>
            <div id="chart4" class="section1_chart"></div>
        </div>
        </div>
        <script>
            vegaEmbed('#chart2', 'bar.json',{actions: false})
            vegaEmbed('#chart3', 'dotplot.json',{actions: false})
            vegaEmbed('#chart4', 'rangedotplot.json',{actions: false})
        </script>
    </section>


</body>
</html>
